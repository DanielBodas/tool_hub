<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for each module ring -->
    <linearGradient id="ring-pink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="ring-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="ring-gold" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Background subtle gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F0C24" />
      <stop offset="100%" stop-color="#070514" />
    </radialGradient>

    <!-- Glow filters for ultra-premium look -->
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Premium Background Squircle -->
  <rect width="512" height="512" rx="144" fill="url(#bg-grad)" />

  <!-- Interlocking Rings Group with blend mode for vibrant overlapping colors -->
  <g filter="url(#ring-glow)" style="mix-blend-mode: screen;">
    <!-- Blue Ring (Bottom-Left / Finance & Precision) -->
    <circle cx="195" cy="295" r="94" fill="none" stroke="url(#ring-blue)" stroke-width="32" opacity="0.9" />

    <!-- Gold Ring (Bottom-Right / Bets & Celebration) -->
    <circle cx="317" cy="295" r="94" fill="none" stroke="url(#ring-gold)" stroke-width="32" opacity="0.9" />

    <!-- Pink Ring (Top / Care & Baby Leaves) -->
    <circle cx="256" cy="190" r="94" fill="none" stroke="url(#ring-pink)" stroke-width="32" opacity="0.9" />
  </g>

  <!-- Central Glow & Core Connection Sparkle (Representing the Hub integration) -->
  <g filter="url(#core-glow)">
    <!-- Central connection node -->
    <circle cx="256" cy="260" r="14" fill="#FFFFFF" />
    <!-- White Elegant 4-pointed Sparkle -->
    <path d="M256,220 Q256,260 296,260 Q256,260 256,300 Q256,260 216,260 Q256,260 256,220 Z" fill="#FFFFFF" />
  </g>
</svg>
